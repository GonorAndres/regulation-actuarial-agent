<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Navy background -->
  <rect width="32" height="32" fill="#000080"/>

  <!-- Body: chunky rounded torso -->
  <rect x="8" y="11" width="16" height="14" rx="3" fill="#DFDFDF"/>

  <!-- Head: wide blocky head -->
  <rect x="6" y="3" width="20" height="10" rx="2" fill="#DFDFDF"/>

  <!-- Eyes: two square pixels, slightly asymmetric for personality -->
  <rect x="10" y="6" width="4" height="4" rx="1" fill="#000080"/>
  <rect x="18" y="6" width="4" height="4" rx="1" fill="#000080"/>

  <!-- Eye glints: tiny white squares for life -->
  <rect x="11" y="7" width="1.5" height="1.5" fill="#FFFFFF"/>
  <rect x="19" y="7" width="1.5" height="1.5" fill="#FFFFFF"/>

  <!-- Warm heart pixel: the Claude nod -->
  <rect x="14" y="15" width="4" height="4" rx="1" fill="#FF6B35"/>

  <!-- Arms: stubby pixel arms reaching out -->
  <rect x="3" y="14" width="5" height="3" rx="1" fill="#DFDFDF"/>
  <rect x="24" y="14" width="5" height="3" rx="1" fill="#DFDFDF"/>

  <!-- Feet: two blocky feet -->
  <rect x="9" y="25" width="5" height="4" rx="1" fill="#DFDFDF"/>
  <rect x="18" y="25" width="5" height="4" rx="1" fill="#DFDFDF"/>

  <!-- Spark: small emanation from head (knowledge/AI) -->
  <rect x="14" y="0" width="4" height="3" fill="#FF6B35"/>
  <rect x="15" y="0" width="2" height="1" fill="#FFFFFF"/>
</svg>

name: Deploy to Cloud Run

on:
  push:
    branches: [main, march]

env:
  REGION: us-central1
  SERVICE: actuarial-regulation-agent
  REGISTRY: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE=${{ env.REGISTRY }}/actuarial-regulation-agent:${{ github.sha }}
          docker build -f Dockerfile -t $IMAGE .
          docker push $IMAGE

      - name: Deploy to Cloud Run
        run: |
          IMAGE=${{ env.REGISTRY }}/actuarial-regulation-agent:${{ github.sha }}
          gcloud run deploy ${{ env.SERVICE }} \
            --image $IMAGE \
            --region ${{ env.REGION }} \
            --platform managed \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --max-instances 3 \
            --min-instances 0 \
            --update-env-vars CLAUDE_MODEL=claude-sonnet-4-6,AUTH_ENABLED=true \
            --update-secrets ANTHROPIC_API_KEY=antrophic-api-key:latest,ACCESS_CODE=access-code:latest,SONNET_PASSWORD=sonnet-password:latest \
            --quiet
